[workspace]
resolver = "2"
members = [
    "crates/rfx-model",
    "crates/rfx-memory",
    "crates/rfx-profiler",
    "crates/rfx-core",
    "crates/rfx-ffi",
    "crates/rfx-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["JLSkyzer"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
rfx-model = { path = "crates/rfx-model" }
rfx-core = { path = "crates/rfx-core" }
rfx-memory = { path = "crates/rfx-memory" }
rfx-profiler = { path = "crates/rfx-profiler" }
rfx-bench = { path = "crates/rfx-bench" }

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
ciborium = { version = "0.2", default-features = false }
jni = "0.21"
# WORKID_V1 impose xxh3_64 (cahier des charges, DM-01).
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# R-522 : `panic = "unwind"` est OBLIGATOIRE. Avec `abort`, une panic Rust tuerait la
# JVM au lieu d'etre capturee par `catch_unwind` a la frontiere FFI (C-27).
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
strip = "debuginfo"
