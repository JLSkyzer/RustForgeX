[workspace]
resolver = "2"
members = [
    "crates/rfx-model",
    "crates/rfx-memory",
    "crates/rfx-profiler",
    "crates/rfx-taskgraph",
    "crates/rfx-scheduler",
    "crates/rfx-cache",
    "crates/rfx-bytecode",
    "crates/rfx-analyzer",
    "crates/rfx-core",
    "crates/rfx-ffi",
    "crates/rfx-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["JLSkyzer"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
rfx-model = { path = "crates/rfx-model" }
rfx-core = { path = "crates/rfx-core" }
rfx-memory = { path = "crates/rfx-memory" }
rfx-profiler = { path = "crates/rfx-profiler" }
rfx-taskgraph = { path = "crates/rfx-taskgraph" }
rfx-scheduler = { path = "crates/rfx-scheduler" }
rfx-cache = { path = "crates/rfx-cache" }
rfx-bytecode = { path = "crates/rfx-bytecode" }
rfx-analyzer = { path = "crates/rfx-analyzer" }
rfx-bench = { path = "crates/rfx-bench" }

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
ciborium = { version = "0.2", default-features = false }
# Files a vol de travail de Chase-Lev (ADR-044).
crossbeam-deque = "0.8"
# Arene de taches de C-31 (ADR-047) : n'en sont utilisees que les allocations faillibles.
bumpalo = "3.20"
jni = "0.21"
# WORKID_V1 impose xxh3_64 (cahier des charges, DM-01).
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# R-522 : `panic = "unwind"` est OBLIGATOIRE. Avec `abort`, une panic Rust tuerait la
# JVM au lieu d'etre capturee par `catch_unwind` a la frontiere FFI (C-27).
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
strip = "debuginfo"
