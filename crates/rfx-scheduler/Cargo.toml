[package]
name = "rfx-scheduler"
description = "C-17, C-18 : ordonnanceur a vol de travail et contexte d'execution des taches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rfx-memory = { workspace = true }
rfx-taskgraph = { workspace = true }
# Files de Chase-Lev (ADR-044) : les ecrire ici demanderait du code `unsafe`.
crossbeam-deque = { workspace = true }

[dev-dependencies]
rfx-model = { workspace = true }

[lints.rust]
missing_docs = "deny"
# `deny` et non `forbid` : la bibliotheque n'a aucun bloc `unsafe`, mais T-273 installe
# un allocateur global pour compter les allocations, et `GlobalAlloc` est un trait
# `unsafe`. `forbid` interdirait meme cette derogation locale, donc la preuve de R-433.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
