[package]
name = "rfx-cache"
description = "C-09, C-48 : base des unites de travail, persistance et rotation des fichiers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rfx-model = { workspace = true }
serde = { workspace = true, features = ["std"] }
xxhash-rust = { workspace = true }

[lints.rust]
missing_docs = "deny"
# `deny` et non `forbid` : la bibliotheque n'a aucun bloc `unsafe`, mais le test
# d'acceptance de la memoire installe un allocateur global pour compter les octets, et
# `GlobalAlloc` est un trait `unsafe`. `forbid` interdirait meme cette derogation locale.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
