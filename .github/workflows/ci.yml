name: CI

# C-40. Cahier des charges, PARTIE 24.
#
# Jobs du jalon M0. Les jobs `test-integration`, `test-forge`, `bench-quick` et
# `security` de la PARTIE 24.2 arriveront avec les composants qu'ils exercent : un job
# vert qui ne vérifie rien serait pire que pas de job du tout.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer la toolchain épinglée
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Installer la toolchain épinglée
        run: rustup show active-toolchain || rustup toolchain install
      # R-003 : aucun avertissement toléré.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-unit:
    name: test-unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Installer la toolchain épinglée
        run: rustup show active-toolchain || rustup toolchain install

      - name: Tests Rust
        run: cargo test --workspace

      # `test` déclenche buildNative : les tests Java s'exécutent donc contre le
      # binaire natif réellement construit sur cette plateforme, y compris le test
      # d'intégration qui traverse la frontière (T-110, T-004, T-360).
      - name: Tests Java
        run: ./gradlew test --no-daemon

      # T-006 : le job `lint-no-fiction` de la PARTIE 24.2 est réalisé par
      # FondationsTest, qui scanne les sources Java et Rust. Il tourne donc déjà
      # ci-dessus ; cette étape ne fait que le nommer pour le rapport de CI.
      - name: lint-no-fiction
        run: ./gradlew test --tests 'dev.rustforgex.FondationsTest' --no-daemon

  build:
    name: build + artifact-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Installer la toolchain épinglée
        run: rustup show active-toolchain || rustup toolchain install

      - name: Construire le JAR
        run: ./gradlew build --no-daemon

      # T-010 : le JAR ne contient que ce que prévoit la PARTIE 3.7, et les natifs
      # empaquetés correspondent à leur empreinte.
      - name: artifact-verify
        run: ./gradlew artifactVerify --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rustforgex-jar
          path: build/libs/*.jar
          if-no-files-found: error
