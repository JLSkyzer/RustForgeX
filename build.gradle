buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Plugin de lancement (ADR-017).
//
// ModLauncher charge la couche d'amorcage AVANT les mods, et c'est la que les
// ILaunchPluginService sont cherches. Le transformateur de bytecode ne peut donc pas
// vivre dans le JAR du mod : il a son propre jeu de sources, ses propres dependances
// -- ASM et ModLauncher, jamais Minecraft -- et son propre artefact.
sourceSets {
    launch
}

// Le plugin de lancement est un module nomme : voir src/launch/java/module-info.java.
// Dans la couche d'amorcage, un service n'est decouvert que s'il est declare par
// `provides` ; un META-INF/services suffit sur le classpath, pas la. Sans ce reglage,
// Gradle compilerait les dependances sur le classpath et les `requires` ne
// resoudraient pas.
tasks.named('compileLaunchJava', JavaCompile).configure {
    modularity.inferModulePath = true
}

// Artefact du plugin de lancement.
tasks.register('launchJar', Jar) {
    from sourceSets.launch.output
    archiveBaseName = "${mod_id}-launch"
    // Meme exigence de reproductibilite que le JAR du mod (R-570).
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes([
                'Specification-Title'   : "${mod_id}-launch",
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : "${mod_id}-launch",
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
                // Pas de FMLModType : cet attribut ferait adopter le JAR par FML comme
                // fichier de mod, donc comme module de la couche du jeu -- alors qu'il
                // est deja module de la couche d'amorcage. La resolution echouerait sur
                // « reads more than one module named rustforgex.launch ».
        ])
    }
}

tasks.named('assemble').configure {
    dependsOn 'launchJar'
}

// Le JAR de lancement doit figurer dans le fichier de classpath que BootstrapLauncher
// lit pour batir la couche d'amorcage (ADR-017).
//
// C'est la que les ILaunchPluginService sont cherches, et il n'y a pas de seconde
// chance : LaunchPluginHandler s'execute avant que les ITransformerDiscoveryService
// n'aient rendu leurs candidats. Un JAR decouvert plus tard peut encore fournir un
// ITransformationService, jamais un plugin de lancement.
//
// Une declaration `runtimeOnly` ne suffit pas : ForgeGradle ecrit ce fichier depuis sa
// propre resolution, et un artefact produit par le projet lui-meme n'y figure pas.
// On l'y ajoute donc apres coup, sur les taches de preparation des runs.
//
// Reglage propre au developpement. En production, ModDirTransformerDiscoverer parcourt
// <gameDir>/mods des l'initialisation precoce, avant la construction de la couche --
// mais il s'en abstient explicitement quand la cible de lancement contient « dev ».
tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }
        .configureEach {
    dependsOn 'launchJar'
    // Sur la tache de run et non sur `prepareRun*` : celle-ci est souvent a jour, donc
    // sautee, et l'ajout ne serait fait qu'une fois sur deux.
    doFirst {
        def launchJarFile = tasks.named('launchJar', Jar).get().archiveFile.get().asFile
        fileTree(project.file('build/classpath')) { include '*_minecraftClasspath.txt' }
                .each { classpathFile ->
                    def entries = classpathFile.readLines()
                    if (!entries.any { it.trim() == launchJarFile.absolutePath }) {
                        classpathFile.append(System.lineSeparator() + launchJarFile.absolutePath)
                    }
                }
    }
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Plugin de lancement : compile contre ASM et ModLauncher seulement. Les deux sont
    // fournis par la couche d'amorcage a l'execution, d'ou `compileOnly`.
    launchCompileOnly 'org.ow2.asm:asm:9.2'
    launchCompileOnly 'org.ow2.asm:asm-tree:9.2'
    launchCompileOnly 'cpw.mods:modlauncher:10.0.9'
    launchCompileOnly 'org.slf4j:slf4j-api:1.8.0-beta4'

    // Le mod voit le plugin -- la couche d'amorcage est parente de celle du jeu --
    // mais ne l'embarque pas : a l'execution, il vient de la couche parente.
    compileOnly sourceSets.launch.output


    // Les tests d'instrumentation portent sur le code du plugin de lancement.
    testImplementation sourceSets.launch.output
    testImplementation 'org.ow2.asm:asm:9.2'
    testImplementation 'org.ow2.asm:asm-tree:9.2'

    // Tests unitaires (PARTIE 20). JUnit 5 est la seule dependance de test.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// ---------------------------------------------------------------------------
// C-40 : construction du binaire natif (cahier des charges, PARTIE 23.2)
//
// Gradle est le point d'entree unique : `:buildNative` appelle cargo, `:copyNative`
// depose le binaire dans les ressources, `:hashNative` ecrit son SHA-256 (que C-03
// verifie obligatoirement avant chargement, R-300) et `:nativeManifest` publie la
// liste des plateformes incluses (PARTIE 23.5).
//
// Une cible native indisponible n'echoue PAS le build : le JAR est produit sans ce
// natif et le runtime passera en DEGRADED avec un message explicite (PARTIE 23.5).
// ---------------------------------------------------------------------------

var hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
var hostArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)

var nativeTarget = null
var nativeLibName = null
var nativeDir = null

if (hostOs.contains('windows') && (hostArch == 'amd64' || hostArch == 'x86_64')) {
    nativeTarget = 'x86_64-pc-windows-msvc'
    nativeLibName = 'rfx_native.dll'
    nativeDir = 'windows-x86_64'
} else if (hostOs.contains('linux') && (hostArch == 'amd64' || hostArch == 'x86_64')) {
    nativeTarget = 'x86_64-unknown-linux-gnu'
    nativeLibName = 'librfx_native.so'
    nativeDir = 'linux-x86_64'
} else if (hostOs.contains('linux') && (hostArch == 'aarch64' || hostArch == 'arm64')) {
    nativeTarget = 'aarch64-unknown-linux-gnu'
    nativeLibName = 'librfx_native.so'
    nativeDir = 'linux-aarch64'
}

var cargoDisponible = {
    try {
        var p = new ProcessBuilder('cargo', '--version').redirectErrorStream(true).start()
        p.inputStream.text
        return p.waitFor() == 0
    } catch (Exception ignored) {
        return false
    }
}()

var nativesRoot = layout.projectDirectory.dir('src/main/resources/natives')

tasks.register('buildNative', Exec) {
    group = 'rustforgex'
    description = 'Compile la bibliotheque native pour la plateforme hote'
    workingDir rootDir
    commandLine 'cargo', 'build', '--release', '--target', nativeTarget ?: 'inconnu'
    onlyIf {
        if (nativeTarget == null) {
            logger.warn("RUSTFORGE-X : plateforme ${hostOs}/${hostArch} sans cible native definie, " +
                    'le JAR sera produit sans binaire natif (runtime en DEGRADED).')
            return false
        }
        if (!cargoDisponible) {
            logger.warn('RUSTFORGE-X : cargo est introuvable dans le PATH, le JAR sera produit ' +
                    'sans binaire natif (runtime en DEGRADED). Voir BUILDING.md.')
            return false
        }
        return true
    }
}

tasks.register('copyNative', Copy) {
    group = 'rustforgex'
    description = 'Depose le binaire natif dans les ressources du mod'
    dependsOn 'buildNative'
    from "target/${nativeTarget}/release/${nativeLibName}"
    into nativesRoot.dir(nativeDir ?: 'inconnu')
    onlyIf { nativeTarget != null && file("target/${nativeTarget}/release/${nativeLibName}").exists() }
}

tasks.register('hashNative') {
    group = 'rustforgex'
    description = 'Ecrit le SHA-256 du binaire natif, verifie par C-03 avant chargement'
    dependsOn 'copyNative'
    doLast {
        if (nativeDir == null) {
            return
        }
        var lib = nativesRoot.dir(nativeDir).file(nativeLibName).asFile
        if (!lib.exists()) {
            return
        }
        var digest = java.security.MessageDigest.getInstance('SHA-256')
        var hex = digest.digest(lib.bytes).encodeHex().toString()
        // Format : le condense hexadecimal minuscule seul, suivi d'un saut de ligne.
        new File(lib.parentFile, "${nativeLibName}.sha256").text = "${hex}\n"
        logger.lifecycle("RUSTFORGE-X : natif ${nativeDir}/${nativeLibName} (${lib.length()} octets) sha256=${hex}")
    }
}

tasks.register('nativeManifest') {
    group = 'rustforgex'
    description = 'Publie la liste des plateformes natives incluses dans le JAR'
    dependsOn 'hashNative'
    doLast {
        var racine = nativesRoot.asFile
        var plateformes = []
        if (racine.exists()) {
            racine.listFiles()?.sort { it.name }?.each { dossier ->
                if (!dossier.directory) {
                    return
                }
                dossier.listFiles()?.sort { it.name }?.each { fichier ->
                    if (fichier.name.endsWith('.sha256')) {
                        return
                    }
                    var empreinte = new File(dossier, "${fichier.name}.sha256")
                    plateformes << [
                            plateforme: dossier.name,
                            bibliotheque: fichier.name,
                            octets: fichier.length(),
                            sha256: empreinte.exists() ? empreinte.text.trim() : null
                    ]
                }
            }
        } else {
            racine.mkdirs()
        }
        var manifeste = [
                schema      : 1,
                mod_version : project.version.toString(),
                abi_version : 1,
                plateformes : plateformes
        ]
        new File(racine, 'manifest.json').text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(manifeste)) + '\n'
        if (plateformes.isEmpty()) {
            logger.warn('RUSTFORGE-X : aucun binaire natif empaquete, le runtime demarrera en DEGRADED.')
        }
    }
}

// T-010 / job CI `artifact-verify` (PARTIE 24.2) : le JAR ne contient que ce qui est
// prevu en PARTIE 3.7, aucun asset tiers, et les natifs empaquetes correspondent a
// leur empreinte.
tasks.register('artifactVerify') {
    group = 'rustforgex'
    description = 'Verifie le contenu du JAR : natifs, empreintes, absence d\'asset tiers'
    dependsOn 'jar'
    doLast {
        var archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!archive.exists()) {
            throw new GradleException("JAR introuvable : ${archive}")
        }

        // Prefixes autorises, derives du contenu attendu de l'artefact final (3.7).
        var autorises = [
                'META-INF/', 'dev/rustforgex/', 'natives/',
                'assets/rustforgex/', 'data/rustforgex/',
                'pack.mcmeta', 'rustforgex.mixins.json', 'rustforgex.refmap.json'
        ]

        var intrus = []
        var natifs = [:]
        var empreintes = [:]

        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entree ->
                if (entree.directory) {
                    return
                }
                var nom = entree.name
                if (!autorises.any { nom == it || nom.startsWith(it) }) {
                    intrus << nom
                }
                if (nom.startsWith('natives/') && nom.endsWith('.sha256')) {
                    empreintes[nom - '.sha256'] = zip.getInputStream(entree).text.trim()
                } else if (nom.startsWith('natives/') && !nom.endsWith('.json')) {
                    var digest = java.security.MessageDigest.getInstance('SHA-256')
                    natifs[nom] = digest.digest(zip.getInputStream(entree).bytes).encodeHex().toString()
                }
            }
        }

        if (!intrus.isEmpty()) {
            throw new GradleException(
                    "Le JAR contient des entrees non prevues par la PARTIE 3.7 :\n  " + intrus.join('\n  '))
        }

        natifs.each { chemin, reel ->
            var attendu = empreintes[chemin]
            if (attendu == null) {
                throw new GradleException("Natif sans empreinte dans le JAR : ${chemin}")
            }
            if (attendu != reel) {
                throw new GradleException(
                        "Empreinte incorrecte pour ${chemin} : attendu ${attendu}, obtenu ${reel}")
            }
        }

        logger.lifecycle("RUSTFORGE-X : artefact verifie (${archive.name}, ${archive.length()} octets, " +
                "${natifs.size()} natif(s) empaquete(s) et verifie(s)).")
    }
}

// ---------------------------------------------------------------------------
// Confort de developpement : le serveur de `run/` doit accepter le client lance par
// `runClient`.
//
// Le client de ForgeGradle demarre sans session Mojang authentifiee. Un serveur en
// `online-mode=true` demande a Mojang de valider cette session, echoue, et deconnecte
// le client avec « Invalid session ». Le meme mecanisme s'applique a
// `enforce-secure-profile`, qui exige une cle de profil signee.
//
// `run/` est un environnement de developpement jetable, ignore par git. Le basculer
// hors ligne est sans consequence pour un serveur de production, qui n'utilise jamais
// ce fichier. L'EULA, elle, n'est jamais touchee : son acceptation appartient a
// l'utilisateur seul.
// ---------------------------------------------------------------------------
tasks.register('prepareDevServer') {
    group = 'rustforgex'
    description = 'Autorise le client de developpement a rejoindre le serveur de run/'
    doLast {
        var proprietes = file('run/server.properties')
        if (!proprietes.exists()) {
            // Le fichier est cree par le serveur a son premier demarrage : rien a faire
            // avant qu'il existe.
            return
        }
        var avant = proprietes.text
        var apres = avant
                .replaceAll(/(?m)^online-mode\s*=\s*true$/, 'online-mode=false')
                .replaceAll(/(?m)^enforce-secure-profile\s*=\s*true$/, 'enforce-secure-profile=false')
        if (apres != avant) {
            proprietes.text = apres
            logger.lifecycle('RUSTFORGE-X : run/server.properties bascule en mode hors ligne ' +
                    "(online-mode et enforce-secure-profile a false) pour que le client de " +
                    "developpement puisse se connecter. Ce fichier ne concerne que run/.")
        }
    }
}

// ForgeGradle cree ses taches `run*` apres l'evaluation du script : `tasks.named` ne
// les trouverait pas encore. `matching` les configure des qu'elles apparaissent.
tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn 'prepareDevServer'
}

tasks.register('cleanNative', Delete) {
    group = 'rustforgex'
    description = 'Supprime les binaires natifs deposes dans les ressources'
    delete nativesRoot
}

tasks.named('processResources').configure {
    dependsOn 'nativeManifest'
}

// PARTIE 23.4 : deux builds du meme commit doivent produire des archives identiques.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
